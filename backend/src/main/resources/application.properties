server.port=4000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:horse_betting}
spring.datasource.username=${DB_USER:horseadmin}
spring.datasource.password=${DB_PASSWORD:horsepass123}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Init SQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT
jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion}
jwt.expiration=${JWT_EXPIRATION:604800000}

# CORS
app.cors.origin=${CORS_ORIGIN:*}

# Socket.IO
socket.io.port=9092
